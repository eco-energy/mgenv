name:                mgenv
version:             0.1.0.0
github:              faezs/mgenv
license:             BSD3
author:              Faez Shakil
maintainer:          faez.shakil@gmail.com
copyright:           2019 Faez Shakil

extra-source-files:
- README.md
- ChangeLog.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on Github at <https://github.com/faezs/mgenv#readme>

dependencies:
- base >= 4.11 && < 10
- rio >= 0.1.8.0
- streamly
- algebraic-graphs
- time
- astro
- extra
- elm-bridge
- aeson
- MemoTrie
- parallel
- fused-effects
- monad-bayes
- non-empty
- geodetics
- mtl
- hgeometry
- hgeometry-combinatorial
- containers
- lens
- concat-classes
- concat-examples
- concat-plugin
- text
- elminator
- adjunctions
- distributive
- warp
- fast-logger
- servant
- servant-server
- wai-middleware-static
- bytestring
- QuickCheck

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  mgenv-exe:
    main:                Main.hs
    source-dirs:         app
    dependencies:
    - mgenv
    - optparse-simple

    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N

tests:
  mgenv-test:
    main:                Spec.hs
    source-dirs:         test
    dependencies:
    - mgenv
    - hspec
    - QuickCheck

    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
